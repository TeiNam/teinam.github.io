title: rastalion.dev
tagline: Database와 A.I 그리고 그 사이의 Data Pipeline
author: teinam
email: career@rastalion.me
description: Database와 A.I 그리고 그 사이의 Data Pipeline 을 다루는 teinam 의 기술 노트.
url: "https://teinam.github.io"
baseurl: ""
lang: ko

permalink: /writing/:title/
markdown: kramdown
highlighter: rouge
kramdown:
  syntax_highlighter_opts:
    disable: false

social:
  linkedin: rastalion
  github: TeiNam

newsletter_action: ""   # 예: https://buttondown.email/api/emails/embed-subscribe/rastalion

adsense:
  client: "ca-pub-8706947448795380"
  in_article: "7707603154"    # gh-in-article
  sidebar: "7091586135"       # gh-sidebar
  leaderboard: "8404667808"   # gh-leaderboard — 홈 하단
  docs: "8404667808"          # docs·handbook 하단. 지금은 leaderboard 재사용,
                              # 전용 광고 단위를 만들면 이 줄만 바꾸면 된다

# 실제 존재하는 페이지만 둔다. 항목을 추가하면 해당 파일도 같이 만든다.
nav:
  - { name: writing, url: /writing/ }
  - { name: docs, url: /docs/ }
  - { name: handbook, url: /handbook/ }
  - { name: work, url: /work/ }
  - { name: about, url: /about/ }

defaults:
  - scope: { path: "", type: posts }
    values: { layout: post }
  - scope: { path: "docs" }
    values: { layout: docs }
  - scope: { path: "handbook" }
    values: { layout: docs, nav_data: handbook_nav, breadcrumb: Handbook }

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

exclude: [Gemfile, Gemfile.lock, README.md, vendor]
