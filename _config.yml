title: rastalion.dev
tagline: Database와 A.I 그리고 그 사이의 Data Pipeline
author: teinam
email: career@rastalion.me
description: Database와 A.I 그리고 그 사이의 Data Pipeline 을 다루는 teinam 의 기술 노트.
url: "https://teinam.github.io"
baseurl: ""
lang: ko

permalink: /writing/:title/
markdown: kramdown
highlighter: rouge
kramdown:
  syntax_highlighter_opts:
    disable: false

social:
  linkedin: rastalion
  github: TeiNam

newsletter_action: ""   # 예: https://buttondown.email/api/emails/embed-subscribe/rastalion

adsense:
  client: "ca-pub-8706947448795380"
  in_article: "7707603154"    # gh-in-article
  sidebar: "7091586135"       # gh-sidebar
  leaderboard: "8404667808"   # gh-leaderboard — 홈 하단
  docs: "8404667808"          # docs·handbook 하단. 지금은 leaderboard 재사용,
                              # 전용 광고 단위를 만들면 이 줄만 바꾸면 된다

# 실제 존재하는 페이지만 둔다. 항목을 추가하면 해당 파일도 같이 만든다.
nav:
  - { name: writing, url: /writing/ }
  - { name: docs, url: /docs/ }
  - { name: career, url: /career/ }
  - { name: work, url: /work/ }
  - { name: about, url: /about/ }

# /writing/ 필터 버튼 순서. 여기 없는 카테고리는 뒤에 붙는다(필터에서 누락되지 않도록).
category_order: [database, mysql, postgresql, mongodb, redis]

# 포스트 댓글 (giscus — GitHub Discussions 를 저장소로 쓴다).
# repo_id·category_id 가 비어 있으면 댓글 영역이 아예 렌더되지 않는다.
#
# 켜려면 순서대로:
#   1. 저장소 Settings → General → Features → Discussions 체크
#   2. Discussions 에 Announcements 형식으로 "Comments" 카테고리 생성
#      (Announcements 여야 관리자만 글을 열 수 있어 아무나 빈 스레드를 못 만든다)
#   3. https://github.com/apps/giscus 에서 이 저장소에 앱 설치
#   4. https://giscus.app 에 저장소를 넣으면 나오는 두 ID 를 아래에 붙인다
giscus:
  repo: TeiNam/teinam.github.io
  repo_id: ''
  category: Comments
  category_id: ''

defaults:
  - scope: { path: "", type: posts }
    values: { layout: post }
  - scope: { path: "docs" }
    values: { layout: docs }
  - scope: { path: "career" }
    values: { layout: docs, nav_data: career_nav, breadcrumb: Career }

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-redirect-from   # /handbook/... 옛 주소를 /career/... 로 넘긴다

exclude: [Gemfile, Gemfile.lock, README.md, vendor]
