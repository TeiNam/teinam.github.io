title: rastalion.dev
tagline: Database와 A.I 그리고 그 사이의 Data Pipeline
author: teinam
email: teinam@rastalion.dev
description: 
url: "https://teinam.github.io"
baseurl: ""
lang: ko

permalink: /writing/:title/
markdown: kramdown
highlighter: rouge
kramdown:
  syntax_highlighter_opts:
    disable: false

social:
  x: rastalion
  linkedin: rastalion
  github: rastalion

newsletter_action: ""   # 예: https://buttondown.email/api/emails/embed-subscribe/rastalion

adsense:
  client: ""            # 예: ca-pub-0000000000000000
  in_article: ""        # 슬롯 ID
  sidebar: ""
  leaderboard: ""

# 실제 존재하는 페이지만 둔다. docs/work/about 은 파일 만든 뒤 다시 추가.
nav:
  - { name: writing, url: /writing/ }

defaults:
  - scope: { path: "", type: posts }
    values: { layout: post }
  - scope: { path: "docs" }
    values: { layout: docs }

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

exclude: [Gemfile, Gemfile.lock, README.md, vendor]
