<footer class="site-foot">
  <div class="foot-col">
    <span class="wordmark">rastalion<span>.</span>dev</span>
    <span class="mono dim">{{ site.tagline }}</span>
  </div>
  <div class="foot-col">
    <span class="label">Elsewhere</span>
    {%- if site.social.linkedin %}<a href="https://www.linkedin.com/in/{{ site.social.linkedin }}">LinkedIn</a>{% endif %}
    {%- if site.social.github %}<a href="https://github.com/{{ site.social.github }}">GitHub</a>{% endif %}
    <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
  </div>
  <div class="foot-col">
    <span class="mono dim">© {{ site.time | date: '%Y' }} {{ site.author }}</span>
    {%- if site.goatcounter != "" %}<span class="mono dim" data-gc-path="TOTAL" hidden><b></b> views</span>{% endif %}
  </div>
</footer>
<script src="{{ '/assets/js/theme.js' | relative_url }}" defer></script>
{%- if site.goatcounter != "" %}
<script data-goatcounter="https://{{ site.goatcounter }}.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
<script src="{{ '/assets/js/counter.js' | relative_url }}" data-base="https://{{ site.goatcounter }}.goatcounter.com" defer></script>
{%- endif %}
