# GitHub Pages 배포. 빌드 직전에 공유 카드가 없는 포스트만 카드를 만들어 함께 올린다.
# 카드와 image: 줄은 러너 안에서만 생기고 저장소에는 커밋되지 않는다 — 머지 순서와
# 상관없이 배포본에는 항상 카드가 붙는다. 빌드는 legacy 와 같은 github-pages gem 이다.
name: Pages

on:
  push:
    branches: [main]
  # PR 에서는 카드 생성과 빌드만 확인하고 배포하지 않는다
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포가 겹치면 진행 중인 배포는 끝까지 두고 대기 중인 것만 최신으로 바꾼다
concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*

      # 카드가 실패해도 배포는 막지 않는다. 그 글은 _config.yml 기본 카드로 나가고
      # 실패는 이 단계의 경고로 남는다
      - name: Generate share cards for posts without image
        continue-on-error: true
        run: |
          browser="$(command -v google-chrome || command -v chromium || true)"
          if [ -z "$browser" ]; then
            echo "::warning::Chrome 을 찾지 못해 공유 카드를 건너뜁니다"
            exit 1
          fi
          OG_BROWSER="$browser" node _tools/og-cards.mjs

      - uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1.0.13
        with:
          source: ./
          destination: ./_site

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
